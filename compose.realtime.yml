name: salesmanchatbot-realtime

services:
  realtime:
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/realtime/docker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - salesmanchatbot-network

networks:
  salesmanchatbot-network:
    external: true
    name: salesmanchatbot-network
