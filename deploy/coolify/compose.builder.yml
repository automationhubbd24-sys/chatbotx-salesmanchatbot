name: salesmanchatbot-builder

services:
  builder:
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/builder/docker/Dockerfile
    env_file:
      - ../../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RUN_DB_MIGRATE: "true"
      RUN_DB_SEED: "false"
      REALTIME_INTERNAL_URL: "http://realtime:1999"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - salesmanchatbot-network

networks:
  salesmanchatbot-network:
    external: true
    name: salesmanchatbot-network
